<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Peoria Chimney Sweep">
  <defs>
    <linearGradient id="brick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c44736"/>
      <stop offset="100%" stop-color="#8f2d22"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243758"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
  </defs>
  <!-- rounded tile -->
  <rect width="64" height="64" rx="14" fill="url(#navy)"/>
  <!-- soft highlight -->
  <circle cx="48" cy="14" r="18" fill="#ffffff" opacity="0.06"/>
  <!-- chimney body -->
  <path d="M20 48V28.5L32 18l12 10.5V48H20z" fill="url(#brick)"/>
  <!-- chimney top lip -->
  <rect x="18" y="26" width="28" height="4" rx="1.2" fill="#7a2419"/>
  <!-- flue opening -->
  <rect x="28" y="20" width="8" height="6" rx="1" fill="#0f1829"/>
  <!-- door / cleanout suggestion -->
  <rect x="28.5" y="36" width="7" height="12" rx="1.2" fill="#f7f3eb"/>
  <!-- subtle brick lines -->
  <path d="M22 34h20M22 40h20M22 44h20" stroke="#9a2f22" stroke-width="1" opacity="0.55"/>
  <!-- soft smoke plume -->
  <path d="M32 18c0 0 5 4.5 5 8.2a5 5 0 1 1-10 0C27 22.5 32 18 32 18z" fill="#e8a17a" opacity="0.95"/>
  <path d="M36 14c0 0 3.5 3 3.5 5.5a3.4 3.4 0 1 1-6.8 0C32.7 17 36 14 36 14z" fill="#f0c3a4" opacity="0.75"/>
</svg>
